[workspace]
members = [
    "crates/cadcraft-model",
    "crates/cadcraft-format",
    "crates/cadcraft-render",
    "crates/cadcraft-import",
    "crates/cadcraft-export",
    "crates/cadcraft-assistant",
    "crates/cad-craft",
    "crates/cadcraft-gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/Vandecao/CAD-CRAFT"
authors = ["Vanderlei Braga"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
