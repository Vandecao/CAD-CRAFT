# Continuous integration: the same checks as scripts/validate.ps1, plus the
# dependency policy (deny.toml). No secrets, no deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (full workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the Rust version; rustup installs it here.
      - name: Rust toolchain
        run: rustup show
      - name: Validate (fmt, check, test, clippy, diff, PowerShell tests)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/validate.ps1

  linux:
    name: Linux (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      # The GUI needs desktop window libraries; the core has no GUI dependency.
      - name: Clippy (core crates)
        run: cargo clippy --workspace --exclude cadcraft-gui --all-targets --locked -- -D warnings
      - name: Tests (core crates)
        run: cargo test --workspace --exclude cadcraft-gui --locked

  dependencies:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
