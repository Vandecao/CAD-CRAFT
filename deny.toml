# cargo-deny: licenses, sources and duplicates of the dependencies.
# Run with `cargo deny check`. Used by the CI (.github/workflows/ci.yml).
#
# The CAD-CRAFT is GPL-3.0-or-later. Every dependency license below is
# compatible with it. Adding a license here needs a review of compatibility.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
]

[[licenses.clarify]]
# epaint embeds the default egui fonts (OFL-1.1 and Ubuntu Font Licence).
crate = "epaint_default_fonts"
expression = "(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0"
license-files = []

[advisories]
# Advisories need network access to the RustSec database; the CI runs them.
yanked = "warn"
# Vulnerabilities fail for every dependency. "Unmaintained" notices fail only
# for direct dependencies: transitive ones (from egui/eframe) are tracked
# upstream and cannot be replaced here.
unmaintained = "workspace"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
