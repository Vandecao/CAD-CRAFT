[package]
name = "cad-craft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cadcraft-model = { path = "../cadcraft-model" }
cadcraft-format = { path = "../cadcraft-format" }
cadcraft-render = { path = "../cadcraft-render" }
cadcraft-import = { path = "../cadcraft-import" }
cadcraft-export = { path = "../cadcraft-export" }

[dev-dependencies]
# Usados diretamente pelos testes de integração (fachada).
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sevenz-rust2 = { version = "=0.24.2", default-features = false, features = ["compress"] }
# Etapa 21 (aprovado): ler o PDF de volta nos testes.
lopdf = { version = "=0.47.0", default-features = false }

[lints]
workspace = true
