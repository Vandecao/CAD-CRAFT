[package]
name = "cadcraft-format"
description = "CAD-CRAFT native file formats (.cadcraft, .cadsym, .cadmacro, .cadpart, .cadframe) and migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cadcraft-model = { path = "../cadcraft-model" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
# Somente seleciona o backend Rust (miniz_oxide) exigido por deflate-flate2.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
