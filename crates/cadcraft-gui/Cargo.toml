[package]
name = "cadcraft-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The library keeps the name cad_gui (used by the tests) and the executable
# keeps the name cad-gui.exe.
[lib]
name = "cad_gui"
path = "src/lib.rs"

[[bin]]
name = "cad-gui"
path = "src/main.rs"

[dependencies]
cad-craft = { path = "../cad-craft" }
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit", "persistence", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Etapa 12: diálogos nativos Abrir/Salvar.
rfd = "0.17.2"
# Etapa 14 (aprovado): leitura e validação de logotipos PNG/JPEG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Etapa 27 (aprovado): HTTPS para o login "Sign in with ChatGPT" e a Responses API.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
# Etapa 27: PKCE, valores aleatórios e navegador do sistema (já no Cargo.lock).
sha2 = "=0.11.1"
base64 = "=0.22.1"
getrandom = "=0.3.4"
webbrowser = "=1.2.5"

[dev-dependencies]
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
